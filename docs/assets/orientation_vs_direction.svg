<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a3f8f"/>
    </marker>
    <marker id="arrowDir" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8f1f1f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="500" fill="#fdfbf6"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" font-weight="600" fill="#2b2b2b">Orientation (o) vs. direction (dir)</text>
  <text x="350" y="54" text-anchor="middle" font-size="13" fill="#666">A defensive back backpedaling in coverage: facing forward, moving backward</text>

  <!-- compass reference -->
  <circle cx="350" cy="290" r="150" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="3,4"/>
  <text x="350" y="128" text-anchor="middle" font-size="11" fill="#999">0°</text>
  <text x="512" y="294" text-anchor="middle" font-size="11" fill="#999">90°</text>
  <text x="350" y="456" text-anchor="middle" font-size="11" fill="#999">180°</text>
  <text x="192" y="294" text-anchor="middle" font-size="11" fill="#999">270°</text>

  <!-- player -->
  <circle cx="350" cy="290" r="24" fill="#2f6fed" stroke="#1a3f8f" stroke-width="2"/>
  <text x="350" y="296" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">CB</text>

  <!-- orientation arrow: facing "up" toward the QB/line of scrimmage -->
  <line x1="350" y1="266" x2="350" y2="150" stroke="#1a3f8f" stroke-width="3" marker-end="url(#arrowO)"/>
  <text x="358" y="160" font-size="13" fill="#1a3f8f" font-weight="600">o — facing the QB</text>

  <!-- direction arrow: moving backward/down-left, dashed -->
  <line x1="333" y1="308" x2="222" y2="400" stroke="#8f1f1f" stroke-width="3" stroke-dasharray="6,5" marker-end="url(#arrowDir)"/>
  <text x="120" y="425" font-size="13" fill="#8f1f1f" font-weight="600">dir — actually moving (backpedal)</text>

  <text x="350" y="490" text-anchor="middle" font-size="12" fill="#666">
    Both are angles in degrees (0-360°). They're often different — the gap between them is a real, usable signal.
  </text>
</svg>
