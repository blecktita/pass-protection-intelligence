<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="axisArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="400" fill="#fdfbf6"/>
  <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="600" fill="#2b2b2b">Field coordinate system</text>

  <!-- field -->
  <rect x="60" y="60" width="780" height="220" fill="#eef6ec" stroke="#2b2b2b" stroke-width="2"/>
  <!-- end zones -->
  <rect x="60" y="60" width="65" height="220" fill="#dcead9" stroke="#2b2b2b" stroke-width="1"/>
  <rect x="775" y="60" width="65" height="220" fill="#dcead9" stroke="#2b2b2b" stroke-width="1"/>
  <text x="92" y="170" text-anchor="middle" font-size="12" fill="#557a55" transform="rotate(-90 92 170)">end zone</text>
  <text x="808" y="170" text-anchor="middle" font-size="12" fill="#557a55" transform="rotate(-90 808 170)">end zone</text>

  <!-- goal lines -->
  <line x1="125" y1="60" x2="125" y2="280" stroke="#557a55" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="775" y1="60" x2="775" y2="280" stroke="#557a55" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="125" y="298" text-anchor="middle" font-size="11" fill="#557a55">goal line</text>
  <text x="775" y="298" text-anchor="middle" font-size="11" fill="#557a55">goal line</text>

  <!-- x axis -->
  <line x1="60" y1="330" x2="800" y2="330" stroke="#2b2b2b" stroke-width="1.5" marker-end="url(#axisArrow)"/>
  <text x="815" y="335" font-size="14" fill="#2b2b2b">x (yards)</text>
  <g font-size="11" fill="#2b2b2b" text-anchor="middle">
    <text x="60" y="345">0</text>
    <text x="125" y="345">10</text>
    <text x="450" y="345">60</text>
    <text x="775" y="345">110</text>
    <text x="840" y="345">120</text>
  </g>
  <g stroke="#999" stroke-width="1">
    <line x1="60" y1="325" x2="60" y2="335"/>
    <line x1="125" y1="325" x2="125" y2="335"/>
    <line x1="450" y1="325" x2="450" y2="335"/>
    <line x1="775" y1="325" x2="775" y2="335"/>
    <line x1="840" y1="325" x2="840" y2="335"/>
  </g>

  <!-- y axis -->
  <line x1="30" y1="280" x2="30" y2="45" stroke="#2b2b2b" stroke-width="1.5" marker-end="url(#axisArrow)"/>
  <text x="10" y="38" font-size="14" fill="#2b2b2b">y (yd)</text>
  <g font-size="11" fill="#2b2b2b" text-anchor="end">
    <text x="26" y="284">0</text>
    <text x="26" y="174">26.65</text>
    <text x="26" y="64">53.3</text>
  </g>

  <!-- sample player -->
  <circle cx="352" cy="197" r="9" fill="#2f6fed" stroke="#1a3f8f" stroke-width="1.5"/>
  <line x1="352" y1="197" x2="352" y2="330" stroke="#2f6fed" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="352" y1="197" x2="30" y2="197" stroke="#2f6fed" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="362" y="192" font-size="12" fill="#1a3f8f" font-weight="600">one player, one frame: (x=45, y=20)</text>

  <text x="450" y="370" text-anchor="middle" font-size="12" fill="#666">Every player (and the ball) gets one (x, y) reading like this, 10 times per second.</text>
</svg>
